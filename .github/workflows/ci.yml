name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore (fails on known vulnerable dependencies)
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Marea.Tests -c Release --no-build --filter "Category!=Network&Category!=CloudFilter"
      - name: Cloud Files integration tests
        # The Windows cloud filter driver may be unavailable on hosted runners: informative only.
        continue-on-error: true
        run: dotnet test tests/Marea.Tests -c Release --no-build --filter "Category=CloudFilter"
      - name: Vulnerability audit
        run: dotnet list package --vulnerable --include-transitive

  marea-check:
    # The model safety check also runs on macOS and Linux: build it there and test it on real
    # pickles made by Python.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build marea-check
        run: dotnet build src/Marea.Check -c Release -o out
      - name: Self-test
        run: bash build/check-selftest.sh "out/marea-check"

  linux:
    # Marea on Linux: build mareactl, then free and refill real files through the fanotify agent and
    # the systemd service on the runner (needs root, which hosted runners have through sudo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish mareactl for Linux
        run: dotnet publish src/Marea.Cli -f net10.0 -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: End-to-end test (free, refill, in-use, wrong bytes, agent down, service)
        run: sudo bash build/linux-selftest.sh out/mareactl "$USER"

  package:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish portable build
        shell: pwsh
        run: ./build/publish.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marea-portable
          path: |
            dist/*.zip
            dist/*.sha256
