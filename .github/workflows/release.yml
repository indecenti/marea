name: Release

# Builds the portable package on GitHub's runners from the tagged commit, signs Marea's own
# binaries through SignPath when it is configured (see CODE_SIGNING_POLICY.md), attests the build
# provenance (Sigstore, verifiable with `gh attestation verify`) and publishes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/Marea.Tests -c Release --filter "Category!=Network&Category!=CloudFilter"
      - name: Cloud Files integration tests
        # Depends on the cloud filter driver of the hosted runner: informative, like in CI.
        continue-on-error: true
        run: dotnet test tests/Marea.Tests -c Release --no-build --filter "Category=CloudFilter"
      - name: Publish (unsigned)
        shell: pwsh
        run: ./build/publish.ps1 -Version ("${{ github.ref_name }}".TrimStart("v")) -NoPackage

      # --- Code signing (SignPath Foundation). Skipped until the SIGNPATH_API_TOKEN secret and the
      # SIGNPATH_ORGANIZATION_ID variable exist, so releases keep working before approval.
      - name: Is code signing configured?
        id: signing
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $on = -not [string]::IsNullOrEmpty($env:TOKEN) -and -not [string]::IsNullOrEmpty($env:ORG)
          "enabled=$($on.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $on) { Write-Host "SignPath not configured: this release will not be code-signed." }
      - name: Upload unsigned build for signing
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marea-unsigned
          path: dist/Marea
          if-no-files-found: error
      - name: Sign with SignPath (manual approval)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'marea' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signed
      - name: Use the signed files
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/signed/* dist/Marea -Recurse -Force
          foreach ($f in "Marea.exe", "mareactl.exe", "Marea.dll", "mareactl.dll", "Marea.Core.dll", "Marea.CloudFiles.dll") {
            $s = Get-AuthenticodeSignature (Join-Path "dist/Marea" $f)
            if ($s.Status -ne "Valid") { throw "$f is not validly signed: $($s.Status)" }
            Write-Host "$f signed by $($s.SignerCertificate.Subject)"
          }
      # --- End of code signing.

      - name: Package and checksum
        shell: pwsh
        run: ./build/publish.ps1 -Version ("${{ github.ref_name }}".TrimStart("v")) -PackageOnly
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.zip
            dist/Marea/Marea.exe
            dist/Marea/mareactl.exe
      - name: Create pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $verify = "Built by GitHub Actions from $env:GITHUB_SHA. Verify: ``gh attestation verify <file> --repo $env:GITHUB_REPOSITORY``. See CHANGELOG.md."
          $sign = if ($env:SIGNED -eq "true") { "Free code signing provided by SignPath.io, certificate by SignPath Foundation." } else { "Not code-signed yet: SmartScreen may warn." }
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --prerelease --verify-tag --title "Marea ${{ github.ref_name }}" --notes "$verify $sign"

  mareactl-linux:
    # Marea for Linux servers: mareactl with the fanotify agent, as one self-contained binary.
    needs: release
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish mareactl
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          dotnet publish src/Marea.Cli -f net10.0 -c Release -r ${{ matrix.rid }} --self-contained true             -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true             -p:DebugType=none -p:Version=$v -o out
          cp README.md LICENSE SECURITY.md out/
          name="mareactl-$v-${{ matrix.rid }}"
          tar -czf "$name.tar.gz" -C out mareactl README.md LICENSE SECURITY.md
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: End-to-end test on the native target
        if: matrix.rid == 'linux-x64'
        run: sudo bash build/linux-selftest.sh out/mareactl "$USER"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.ASSET }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber

  marea-check:
    # The standalone model safety check for every OS, attached to the same release. macOS
    # binaries are built on a Mac so the .NET SDK can ad-hoc sign them (required on Apple Silicon).
    needs: release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish marea-check
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          dotnet publish src/Marea.Check -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$v -o out
          name="marea-check-$v-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then (cd out && 7z a "../$name.zip" marea-check.exe > /dev/null); f="$name.zip"
          else tar -czf "$name.tar.gz" -C out marea-check; f="$name.tar.gz"; fi
          if command -v sha256sum > /dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          echo "ASSET=$f" >> "$GITHUB_ENV"
      - name: Self-test on the native targets
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        run: bash build/check-selftest.sh out/marea-check
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.ASSET }}
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber
